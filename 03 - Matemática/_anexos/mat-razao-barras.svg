<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"><rect x="0.5" y="0.5" width="879.0" height="379.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Razão e proporção</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Razão compara por divisão; proporção é a igualdade entre duas razões.</text><defs></defs><rect x="20.0" y="70.0" width="420.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Escala 1 : 250.000</text><text x="230.0" y="116.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">6 cm no mapa  →  ?  na realidade</text><rect x="60.0" y="148.0" width="100.0" height="34.0" rx="6.0" fill="#cfe0fb" stroke="#2f6fd0" stroke-width="1.8" opacity="1.00"/><text x="110.0" y="170.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">6 cm</text><text x="178.0" y="170.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="20.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">→</text><rect x="206.0" y="148.0" width="214.0" height="34.0" rx="6.0" fill="#fdeaea" stroke="#b3261e" stroke-width="1.8" opacity="1.00"/><text x="313.0" y="170.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">1.500.000 cm = 15 km</text><line x1="60.0" y1="208.0" x2="420.0" y2="208.0" stroke="#e8ecf1" stroke-width="1.0" stroke-linecap="round"/><text x="230.0" y="240.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="15.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">1 / 250.000 = 6 / D</text><text x="230.0" y="268.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">D = 6 × 250.000 = 1.500.000 cm</text><text x="230.0" y="292.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">1.500.000 cm = 15.000 m = 15 km</text><rect x="460.0" y="70.0" width="400.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="474.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Extremos e meios</text><text x="660.0" y="122.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="20.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">a / b = c / d</text><text x="660.0" y="152.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">produto dos extremos = produto dos meios</text><text x="660.0" y="192.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="19.0" font-weight="700" text-anchor="middle" fill="#b3261e" opacity="1.00">a · d  =  b · c</text><line x1="500.0" y1="216.0" x2="820.0" y2="216.0" stroke="#e8ecf1" stroke-width="1.0" stroke-linecap="round"/><text x="660.0" y="248.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">20.000 candidatos para 50 vagas</text><text x="660.0" y="280.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">20.000 / 50 = 400 / 1</text><text x="660.0" y="310.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">400 candidatos por vaga</text><text x="660.0" y="338.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">razão 400 : 1</text></svg>