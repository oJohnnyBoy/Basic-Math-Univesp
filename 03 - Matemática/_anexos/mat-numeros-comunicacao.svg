<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356"><rect x="0.5" y="0.5" width="879.0" height="355.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Números antes de operar: comunicação</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Marcar quantidades, territórios e rebanhos. As operações só vieram por volta de 2000 a.C.</text><defs></defs><rect x="20.0" y="70.0" width="420.0" height="272.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Marcas de contagem (tally)</text><text x="58.0" y="146.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">I</text><line x1="96.0" y1="120.0" x2="96.0" y2="154.0" stroke="#2f6fd0" stroke-width="2.0" stroke-linecap="round"/><line x1="118.0" y1="120.0" x2="118.0" y2="154.0" stroke="#2f6fd0" stroke-width="2.0" stroke-linecap="round"/><line x1="140.0" y1="120.0" x2="140.0" y2="154.0" stroke="#2f6fd0" stroke-width="2.0" stroke-linecap="round"/><line x1="162.0" y1="120.0" x2="162.0" y2="154.0" stroke="#2f6fd0" stroke-width="2.0" stroke-linecap="round"/><text x="58.0" y="200.0" font-family="Segoe UI, Segoe U