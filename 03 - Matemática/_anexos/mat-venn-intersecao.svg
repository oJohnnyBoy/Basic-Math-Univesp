<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356"><rect x="0.5" y="0.5" width="879.0" height="355.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Interseção de conjuntos</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Pertencer a A e também a B. Sem região comum, a interseção é o conjunto vazio.</text><defs><clipPath id="cx1"><circle cx="183.0" cy="208.0" r="88.0"/><circle cx="257.0" cy="208.0" r="88.0"/></clipPath><clipPath id="cx2"><circle cx="538.0" cy="176.0" r="52.0"/><circle cx="582.0" cy="176.0" r="52.0"/></clipPath><clipPath id="cx3"><circle cx="692.0" cy="176.0" r="52.0"/><circle cx="788.0" cy="176.0" r="52.0"/></clipPath></defs><rect x="20.0" y="70.0" width="400.0" height="272.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A ∩ B — só a região compartilhada</text><circle cx="183.0" cy="208.0" r="88.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="257.0" cy="208.0" r="88.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><rect x="95.0" y="120.0" width="250.0" height="176.0" fill="#f4a3a3" clip-path="url(#cx1)"/><circle cx="183.0" cy="208.0" r="88.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="257.0" cy="208.0" r="88.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="128.4" y="159.6" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="311.6" y="159.6" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><rect x="440.0" y="70.0" width="420.0" height="272.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="454.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Três conjuntos e o caso vazio</text><circle cx="538.0" cy="176.0" r="52.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="582.0" cy="176.0" r="52.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><rect x="486.0" y="124.0" width="148.0" height="104.0" fill="#f4a3a3" clip-path="url(#cx2)"/><circle cx="538.0" cy="176.0" r="52.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="582.0" cy="176.0" r="52.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="505.8" y="147.4" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="614.2" y="147.4" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="560.0" y="254.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">A ∩ B tem elementos</text><circle cx="692.0" cy="176.0" r="52.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="788.0" cy="176.0" r="52.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><rect x="640.0" y="124.0" width="200.0" height="104.0" fill="#f4a3a3" clip-path="url(#cx3)"/><circle cx="692.0" cy="176.0" r="52.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="788.0" cy="176.0" r="52.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="659.8" y="147.4" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="820.2" y="147.4" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="740.0" y="254.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">sem sobreposição → A ∩ B = ∅</text><line x1="450.0" y1="274.0" x2="850.0" y2="274.0" stroke="#e8ecf1" stroke-width="1.0" stroke-linecap="round"/><text x="650.0" y="300.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">{1,2,3} ∩ {3,4,5} = {3}</text><text x="650.0" y="326.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">A ∩ ∅ = ∅      A ∩ A = A      A ∩ U = A</text></svg>