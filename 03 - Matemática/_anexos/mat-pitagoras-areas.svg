-weight="700" text-anchor="middle" fill="#b3261e" opacity="1.00">= 25</text><text x="432.0" y="288.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">soma das áreas</text><text x="432.0" y="306.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">dos catetos</text><text x="432.0" y="330.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">= área da hipotenusa</text><rect x="560.0" y="70.0" width="300.0" height="316.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="574.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Depois: geometria analítica</text><line x1="600.0" y1="256.4" x2="820.0" y2="256.4" stroke="#1f2430" stroke-width="1.5" stroke-linecap="round"/><line x1="600.0" y1="122.0" x2="600.0" y2="290.0" stroke="#1f2430" stroke-width="1.5" stroke-linecap="round"/><path d="M 823.0 256.4 l -9 -4 l 0 8 z" fill="#1f2430"/><path d="M 600.0 119.0 l -4 -9 l 8 0 z" fill="#1f2430"/><polyline points="644.0,256.4 645.1,255.6 646.1,254.8 647.2,254.0 648.3,253.1 649.3,252.3 650.4,251.5 651.5,250.7 652.5,249.9 653.6,249.1 654.7,248.2 655.8,247.4 656.8,246.6 657.9,245.8 659.0,245.0 660.0,244.2 661.1,243.3 662.2,242.5 663.2,241.7 664.3,240.9 665.4,240.1 666.4,239.3 667.5,238.4 668.6,237.6 669.6,236.8 670.7,236.0 671.8,235.2 672.9,234.4 673.9,233.6 675.0,232.7 676.1,231.9 677.1,231.1 678.2,230.3 679.3,229.5 680.3,228.7 681.4,227.8 682.5,227.0 683.5,226.2 684.6,225.4 685.7,224.6 686.7,223.8 687.8,222.9 688.9,222.1 689.9,221.3 691.0,220.5 692.