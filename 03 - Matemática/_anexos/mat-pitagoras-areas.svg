<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400"><rect x="0.5" y="0.5" width="879.0" height="399.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">O teorema de Pitágoras era geometria</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Somar quadrados, não elevar símbolos. A leitura algébrica veio muito depois.</text><defs></defs><rect x="20.0" y="70.0" width="520.0" height="316.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">a² + b² = c²  ·  como área, não como equação</text><polygon points="150.0,280.0 254.0,280.0 150.0,202.0" fill="#eef4fd" stroke="#2f6fd0" stroke-width="2"/><rect x="72.0" y="202.0" width="78.0" height="78.0" rx="3.0" fill="#dbeafe" stroke="#2f6fd0" stroke-width="1.8" opacity="1.00"/><text x="111.0" y="243.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="middle" fill="#1d4ed8" opacity="1.00">9</text><text x="111.0" y="261.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#1d4ed8" opacity="1.00">a²</text><rect x="150.0" y="280.0" width="104.0" heig