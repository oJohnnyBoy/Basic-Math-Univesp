<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"><rect x="0.5" y="0.5" width="879.0" height="379.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Propriedade distributiva</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Distribuir a interseção sobre a união dá exatamente a mesma região pintada.</text><defs><clipPath id="cx4"><circle cx="196.0" cy="206.0" r="80.0"/><circle cx="264.0" cy="206.0" r="80.0"/></clipPath></defs><rect x="20.0" y="70.0" width="420.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A ∩ (B ∪ C)</text><circle cx="196.0" cy="206.0" r="80.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="264.0" cy="206.0" r="80.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><rect x="116.0" y="126.0" width="228.0" height="160.0" fill="#f4a3a3" clip-path="url(#cx4)"/><circle cx="196.0" cy="206.0" r="80.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="264.0" cy="206.0" r="80.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="146.4" y="162.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="313.6" y="162.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="230.0" y="322.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">primeiro B ∪ C, depois a parte que está em A</text><rect x="460.0" y="70.0" width="400.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="474.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">(A ∩ B) ∪ (A ∩ C)</text><circle cx="626.0" cy="206.0" r="80.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="694.0" cy="206.0" r="80.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="626.0" cy="206.0" r="80.0" fill="#f4a3a3" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="694.0" cy="206.0" r="80.0" fill="#f4a3a3" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="626.0" cy="206.0" r="80.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="694.0" cy="206.0" r="80.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="576.4" y="162.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="743.6" y="162.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="660.0" y="322.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">duas interseções separadas, depois a união</text><text x="440.0" y="240.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="30.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">=</text><text x="440.0" y="268.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">mesma região</text><text x="440.0" y="152.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="30.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">=</text></svg>