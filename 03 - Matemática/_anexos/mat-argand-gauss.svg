 UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="end" fill="#98a1ae" opacity="1.00">-1</text><line x1="333.8" y1="212.0" x2="333.8" y2="218.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="333.8" y="232.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="middle" fill="#98a1ae" opacity="1.00">1</text><line x1="282.0" y1="188.8" x2="288.0" y2="188.8" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="277.0" y="192.8" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="end" fill="#98a1ae" opacity="1.00">1</text><line x1="382.5" y1="212.0" x2="382.5" y2="218.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="382.5" y="232.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="middle" fill="#98a1ae" opacity="1.00">2</text><line x1="282.0" y1="162.5" x2="288.0" y2="162.5" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="277.0" y="166.5" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="end" fill="#98a1ae" opacity="1.00">2</text><line x1="431.2" y1="212.0" x2="431.2" y2="218.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="431.2" y="232.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="middle" fill="#98a1ae" opacity="1.00">3</text><line x1="282.0" y1="136.2" x2="288.0" y2="136.2" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="277.0" y="140.2" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="end" fill="#98a1ae" opacity="1.00">3</text><line x1="480.0" y1="212.0" x2="480.0" y2="218.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="480.0" y="232.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="middle" fill="#98a1ae" opacity="1.00">4</text><line x1="282.0" y1="110.0" x2="288.0" y2="110.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="277.0" y="114.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="end" fill="#98a1ae" opacity="1.00">4</text><text x="474.0" y="245.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#5b6472" opacity="1.00">Re</text><text x="259.0" y="114.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#5b6472" opacity="1.00">Im</text><line x1="285.0" y1="215.0" x2="431.2" y2="162.5" stroke="#2f6fd0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="431.2" cy="162.5" r="5.5" fill="#2f6fd0" stroke="none" stroke-width="2.0" opacity="1.00"/><text x="439.2" y="152.5" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">z₁ = 3 + 2i</text><line x1="285.0" y1="215.0" x2="187.5" y2="188.8" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="187.5" cy="188.8" r="5.5" fill="#d97706" stroke="none" stroke-width="2.0" opacity="1.00"/><text x="179.5" y="178.8" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">z₂ = −2 + i</text><line x1="285.0" y1="215.0" x2="333.8" y2="293.8" stroke="#16a34a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="333.8" cy="293.8" r="5.5" fill="#16a34a" stroke="none" stroke-width="2.0" opacity="1.00"/><text x="341.8" y="283.8" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#16a34a" opacity="1.00">z₃ = 1 − 3i</text><text x="290.0" y="350.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">cada complexo vira um ponto do plano</text><rect x="560.0" y="70.0" width="300.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="574.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Por que isso importa</text><text x="580.0" y="122.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">O símbolo i = √−1 não tinha</text><text x="580.0" y="148.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">lugar na reta real.</text><text x="580.0" y="174.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00"></text><text x="580.0" y="200.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Com o plano, os complexos</text><text x="580.0" y="226.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">ganham uma imagem geométrica</text><text x="580.0" y="252.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">e passam a ser aceitos.</text><text x="580.0" y="278.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00"></text><text x="580.0" y="304.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Mesma resistência que os</text><text x="580.0" y="330.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">negativos sofreram antes.</text></svg>