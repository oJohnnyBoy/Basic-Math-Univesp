<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"><rect x="0.5" y="0.5" width="879.0" height="379.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Números complexos no plano</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Argand e Gauss deram aos complexos uma representação geométrica — e legitimidade.</text><defs></defs><rect x="20.0" y="70.0" width="520.0" height="296.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Plano de Argand-Gauss</text><line x1="90.0" y1="215.0" x2="480.0" y2="215.0" stroke="#1f2430" stroke-width="1.5" stroke-linecap="round"/><line x1="90.0" y1="110.0" x2="90.0" y2="320.0" stroke="#1f2430" stroke-width="1.5" stroke-linecap="round"/><path d="M 483.0 215.0 l -9 -4 l 0 8 z" fill="#1f2430"/><path d="M 90.0 107.0 l -4 -9 l 8 0 z" fill="#1f2430"/><line x1="90.0" y1="212.0" x2="90.0" y2="218.0" stroke="#1f2430" stroke-width="1.2" stroke-linecap="round"/><text x="90.0" y="232.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="normal" text-anchor="middle" fill="#98a1ae" opacity="1.00">-4</text><line x1="282.0" y1="320.0" x2="288.0" y2="320.0" stroke="#1f2430" stroke-w