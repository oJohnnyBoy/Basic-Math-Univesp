<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330"><rect x="0.5" y="0.5" width="879.0" height="329.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Contido, não contido e igual</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">A ordem dos elementos não importa: {a, a, b} = {a, b}.</text><defs></defs><rect x="20.0" y="70.0" width="260.0" height="240.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A ⊆ B  ·  A está contido em B</text><circle cx="150.0" cy="194.0" r="78.0" fill="#fde3c8" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="202.0" y="144.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><circle cx="138.0" cy="198.0" r="44.0" fill="#cfe0fb" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><text x="138.0" y="203.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="150.0" y="298.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">todo elemento de A está em B</text><rect x="310.0" y="70.0" width="260.0" height="240.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="324.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A ⊄ B  ·  não está contido</text><circle cx="462.0" cy="194.0" r="70.0" fill="#fde3c8" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="506.0" y="150.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><circle cx="396.0" cy="194.0" r="58.0" fill="#cfe0fb" stroke="#2f6fd0" stroke-width="2.2" opacity="0.95"/><text x="366.0" y="154.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="440.0" y="298.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">existe elemento de A fora de B</text><rect x="600.0" y="70.0" width="260.0" height="240.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="614.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A = B  ·  mesma extensão</text><circle cx="730.0" cy="202.0" r="72.0" fill="#fde3c8" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><circle cx="730.0" cy="186.0" r="72.0" fill="#cfe0fb" stroke="#2f6fd0" stroke-width="2.2" opacity="0.82"/><text x="730.0" y="234.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">A ≡ B</text><text x="730.0" y="298.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">A ⊆ B e B ⊆ A</text></svg>