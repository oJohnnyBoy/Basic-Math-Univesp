<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"><rect x="0.5" y="0.5" width="879.0" height="359.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">União de conjuntos</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Pertencer a A ou a B. A união nunca duplica elementos.</text><defs></defs><rect x="20.0" y="70.0" width="420.0" height="276.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">A ∪ B — toda a área dos dois círculos</text><circle cx="192.0" cy="210.0" r="90.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="268.0" cy="210.0" r="90.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="192.0" cy="210.0" r="90.0" fill="#f4a3a3" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="268.0" cy="210.0" r="90.0" fill="#f4a3a3" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="192.0" cy="210.0" r="90.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="268.0" cy="210.0" r="90.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="136.2" y="160.5" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="323.8" y="160.5" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><rect x="460.0" y="70.0" width="400.0" height="276.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="474.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Elemento repetido conta uma só vez</text><text x="660.0" y="116.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="15.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A = {1, 2, 3}</text><text x="660.0" y="142.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="15.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B = {3, 4, 5}</text><text x="660.0" y="182.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">A ∪ B = {1, 2, 3, 4, 5}</text><line x1="500.0" y1="200.0" x2="820.0" y2="200.0" stroke="#e8ecf1" stroke-width="1.0" stroke-linecap="round"/><rect x="528.0" y="218.0" width="48.0" height="40.0" rx="8.0" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.8" opacity="1.00"/><text x="552.0" y="244.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">1</text><text x="552.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="600" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><rect x="586.0" y="218.0" width="48.0" height="40.0" rx="8.0" fill="#ffffff" stroke="#2f6fd0" stroke-width="1.8" opacity="1.00"/><text x="610.0" y="244.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">2</text><text x="610.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="600" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><rect x="644.0" y="218.0" width="48.0" height="40.0" rx="8.0" fill="#ffffff" stroke="#b3261e" stroke-width="1.8" opacity="1.00"/><text x="668.0" y="244.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">3</text><text x="668.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="600" text-anchor="middle" fill="#b3261e" opacity="1.00">A∩B</text><rect x="702.0" y="218.0" width="48.0" height="40.0" rx="8.0" fill="#ffffff" stroke="#d97706" stroke-width="1.8" opacity="1.00"/><text x="726.0" y="244.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">4</text><text x="726.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="600" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><rect x="760.0" y="218.0" width="48.0" height="40.0" rx="8.0" fill="#ffffff" stroke="#d97706" stroke-width="1.8" opacity="1.00"/><text x="784.0" y="244.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">5</text><text x="784.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.0" font-weight="600" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="660.0" y="306.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">o 3 aparece nos dois, mas entra uma vez só</text><text x="660.0" y="328.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="middle" fill="#1f2430" opacity="1.00">Se A ⊆ B, então A ∪ B = B</text></svg>