<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372"><rect x="0.5" y="0.5" width="879.0" height="371.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Conjuntos disjuntos</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Dois conjuntos são disjuntos quando a interseção é vazia.</text><defs></defs><rect x="20.0" y="70.0" width="420.0" height="288.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Círculos separados: nenhum elemento em comum</text><circle cx="135.0" cy="200.0" r="84.0" fill="#cfe0fb" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="325.0" cy="200.0" r="84.0" fill="#fde3c8" stroke="none" stroke-width="2.0" opacity="1.00"/><circle cx="135.0" cy="200.0" r="84.0" fill="none" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><circle cx="325.0" cy="200.0" r="84.0" fill="none" stroke="#d97706" stroke-width="2.2" opacity="1.00"/><text x="82.9" y="153.8" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">A</text><text x="377.1" y="153.8" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="17.0" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">B</text><text x="230.0" y="308.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#b3261e" opacity="1.00">A ∩ B = ∅</text><text x="230.0" y="332.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">n(A ∪ B) = n(A) + n(B), sem descontar nada</text><rect x="460.0" y="70.0" width="400.0" height="288.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="474.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Pares e ímpares na reta</text><text x="660.0" y="108.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">P = {0, 2, 4, 6, …}</text><text x="660.0" y="132.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#d97706" opacity="1.00">I = {1, 3, 5, 7, …}</text><line x1="500.0" y1="186.0" x2="820.0" y2="186.0" stroke="#1f2430" stroke-width="1.6" stroke-linecap="round"/><line x1="555.0" y1="181.0" x2="555.0" y2="191.0" stroke="#2f6fd0" stroke-width="2.2" stroke-linecap="round"/><text x="555.0" y="208.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">0</text><line x1="576.0" y1="181.0" x2="576.0" y2="191.0" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/><text x="576.0" y="208.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, 