<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396"><rect x="0.5" y="0.5" width="879.0" height="395.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Números transcendentes</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">Não são raiz de nenhum polinômio de coeficientes inteiros.</text><defs></defs><rect x="20.0" y="70.0" width="520.0" height="312.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Onde cada número vive</text><rect x="60.0" y="101.0" width="440.0" height="250.0" rx="14.0" fill="#eef4fd" stroke="#7aa7e0" stroke-width="1.9" opacity="1.00"/><rect x="110.0" y="131.0" width="340.0" height="190.0" rx="14.0" fill="#fdeaea" stroke="#d98d8d" stroke-width="1.9" opacity="1.00"/><rect x="170.0" y="171.0" width="220.0" height="110.0" rx="14.0" fill="#e9f3ea" stroke="#7fbe8c" stroke-width="1.9" opacity="1.00"/><text x="70.0" y="118.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="start" fill="#2f6fd0" opacity="1.00">ℝ  reais</text><text x="120.0" y="148.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="start" fill="#b3261e" opacity="1.00">𝕀  irracionais</text><text x="180.0" y="188.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="start" fill="#2f7d43" opacity="1.00">transcendentes</text><text x="320.0" y="258.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="16.0" font-weight="700" text-anchor="middle" fill="#166534" opacity="1.00">π   e   φ</text><text x="130.0" y="288.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#b3261e" opacity="1.00">√2, √3</text><text x="430.0" y="288.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="700" text-anchor="middle" fill="#2f6fd0" opacity="1.00">½, 5, −7</text><text x="280.0" y="374.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">algébricos: são raiz de algum polinômio</text><rect x="560.0" y="70.0" width="300.0" height="312.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="574.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Raiz de x⁷ + 4x² = 0 ?</text><text x="710.0" y="116.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">π e e nunca são raiz de</text><text x="710.0" y="136.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">nenhum polinômio de coeficientes</text><text x="710.0" y="156.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">inteiros — por isso são</text><text x="710.0" y="182.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="15.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">transcendentes</text><line x1="580.0" y1="204.0" x2="840.0" y2="204.0" stroke="#e8ecf1" stroke-width="1.0" stroke-linecap="round"/><text x="710.0" y="234.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">√2 é irracional, mas é</text><text x="710.0" y="254.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">algébrico (raiz de x² − 2 = 0)</text><text x="710.0" y="288.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2430" opacity="1.00">Todo transcendente é irracional.</text><text x="710.0" y="308.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1f2430" opacity="1.00">Nem todo irracional é transcendente.</text><text x="710.0" y="342.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="12.0" font-weight="600" text-anchor="middle" fill="#b3261e" opacity="1.00">a maioria dos reais é transcendente</text></svg>