o</text><rect x="240.0" y="70.0" width="190.0" height="240.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="254.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Vazio</text><circle cx="335.0" cy="190.0" r="48.0" fill="none" stroke="#9aa3af" stroke-width="2.2" opacity="1.00"/><text x="335.0" y="197.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="22.0" font-weight="700" text-anchor="middle" fill="#5b6472" opacity="1.00">∅</text><text x="335.0" y="272.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.0" font-weight="700" text-anchor="middle" fill="#1f2430" opacity="1.00">∅  ou  { }</text><text x="335.0" y="290.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#5b6472" opacity="1.00">nenhum elemento</text><rect x="460.0" y="70.0" width="190.0" height="240.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="474.0" y="92.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="600" text-anchor="start" fill="#5b6472" opacity="1.00">Universo</text><rect x="476.0" y="100.0" width="158.0" height="168.0" rx="10.0" fill="#fdfdfe" stroke="#9aa3af" stroke-width="1.6" opacity="1.00"/><text x="486.0" y="118.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="14.0" font-weight="700" text-anchor="start" fill="#5b6472" opacity="1.00">U</text><circle cx="555.0" cy="190.0" r="40.0" fill="#cfe0fb" stroke="#2f6fd0" stroke-width="2.2" opacity="1.00"/><text x="555.0" y="196.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size