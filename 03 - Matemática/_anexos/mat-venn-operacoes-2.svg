<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 526" width="884" height="526"><rect x="0.5" y="0.5" width="883.0" height="525.0" rx="12.0" fill="#ffffff" stroke="#dde3ea" stroke-width="1.4" opacity="1.00"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker></defs><text x="22.0" y="32.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="18.0" font-weight="700" text-anchor="start" fill="#1f2430" opacity="1.00">Operações com dois conjuntos</text><text x="22.0" y="54.0" font-family="Segoe UI, Segoe UI Symbol, Cambria Math, DejaVu Sans, Arial, sans-serif" font-size="13.0" font-weight="normal" text-anchor="start" fill="#5b6472" opacity="1.00">A região destacada em vermelho é o resultado de cada operação, dentro do universo U.</text><defs><clipPath id="cx1"><circle cx="417.0" cy="200.0" r="58.0"/><circle cx="467.0" cy="200.0" r="58.0"/></clipPath><mask id="mx2"><rect x="639.0" y="136.0" width="178.0" height="128.0" fill="#fff"/><circle cx="753.0" cy="200.0" r="58.0" fill="#000"/></mask><mask id="mx3"><rect x="67.0" y="358.0" width="178.0" height="128.0" fill="#fff"/><circle cx="131.0" cy="422.0" r="58.0" fill="#000"/></mask><mask id="mx4"><rect x="353.0" y="358.0" width="178.0" height="128.0" fill="#fff"/><circle cx="467.0" cy="422.0" r="58.0" fill="#000"/></mask><mask id="mx5"><rect x="353.0" y="358.0" width="178.0" height="128.0" fill="#fff"/><circle cx="417.0" cy="422.0" r="58.0" fill="#000"/></mask><mask id="mx6"><rect x="610.0" y="340.0" width="236.0" height="146.0" fill="#fff"/><circle cx="703.0" cy="422.0" r="58.0" fill="#000"/><circle cx="753.0" cy="422.0" r="58.0" fill="#000"/></mask></defs><rect x="20.0" y="78.0" width="272.0" height="208.0" rx="10.0" fill="#fafbfd" stroke="#dde3ea" stroke-width="1.2" opacity="1.00"/><text x="34.0" y="100.0" font-family="Segoe UI, Segoe UI Symbol, Ca